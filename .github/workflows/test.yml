name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "requests>=2.32" "urllib3>=2.0" "pyyaml>=6.0"

      - name: Contract tests (both APIs stubbed)
        run: python -m unittest discover -s tests -v
